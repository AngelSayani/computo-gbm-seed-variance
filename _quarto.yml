title: "Seed variance in gradient-boosted tree pipelines for industrial sensor-based fault detection"
subtitle: "How much does a single random seed change what you conclude?"
author:
  - name: Angel Sayani
    corresponding: true
    email: angelsayani@intellchromatics.com
